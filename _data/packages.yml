- name: icalendar
  url: https://icalendar.readthedocs.io/
  badge: stable
  badge_label: Stable
  description: "RFC 5545 parser and generator for iCalendar files. The foundation for every other package in this ecosystem."
  categories:
    - featured
    - cli
    - lib

- name: python-caldav
  url: https://caldav.readthedocs.io/
  badge: stable
  badge_label: Stable
  description: "The only actively maintained Python CalDAV client. Sync and async, scheduling, free/busy, JMAP. Tested against a dozen real servers. Used by Home Assistant."
  categories:
    - featured
    - lib

- name: recurring-ical-events
  url: https://recurring-ical-events.readthedocs.io/
  badge: stable
  badge_label: Stable
  description: "Give it a calendar and a date range, get back every occurrence, exceptions and overrides included."
  categories:
    - featured
    - lib

- name: icalendar-searcher
  url: https://github.com/pycalendar/icalendar-searcher
  badge: stable
  badge_label: Stable
  description: "Client-side search and filtering for iCalendar data for when the server doesn't support the query you need."
  categories:
    - lib
    - cli

- name: python-mergecal
  url: https://mergecal.readthedocs.io/
  badge: stable
  badge_label: Stable
  description: "Merge multiple iCalendar feeds into one. Handles Google Calendar's timezone quirks, deduplicates events. Running in production at MergeCal.org and MyHebrewDates.com."
  categories:
    - lib
    - cli

- name: x-wr-timezone
  url: https://pypi.org/project/x-wr-timezone/
  badge: stable
  badge_label: Stable
  description: "Fixes the non-standard X-WR-TIMEZONE property that Google Calendar exports, so iCalendar files work correctly in strict parsers."
  categories:
    - lib
    - cli

- name: ics-query
  url: https://github.com/pycalendar/ics-query
  badge: stable
  badge_label: Stable
  description: "Query iCalendar files by time range and component type from the command line. Outputs valid iCalendar files. Available via Homebrew, Windows, or Python package managers."
  categories:
    - cli

- name: ical2jcal
  url: https://pycalendar.github.io/ical2jcal/
  badge: stable
  badge_label: Stable
  description: "Converts between iCalendar (RFC 5545) and jCal (RFC 7265, JSON) formats. Available as a Python library and CLI."
  categories:
    - cli

- name: calendaring-jmap
  url: https://calendaring-jmap.readthedocs.io/
  badge: stable
  badge_label: Stable
  description: "Calendar operations over JMAP (RFC 8620 and the JMAP Calendars draft), including scheduling, free/busy, attachments, and push notifications."
  categories:
    - client-server
    - lib

- name: calendaring
  url: https://github.com/pycalendar/calendaring
  badge: poc
  badge_label: Pre-alpha
  description: "One Python API for calendars and task lists, sync and async. CalDAV and local files today; iCalendar feeds, JMAP, and issue trackers are on the roadmap."
  categories:
    - client-server
    - lib

- name: open-web-calendar
  url: https://open-web-calendar.quelltext.eu/
  badge: stable
  badge_label: Stable
  description: "Embed any iCalendar feed as a web calendar. No account, no database, no tracking. Self-hostable."
  categories:
    - client-server
    - featured
    - user

- name: plann
  url: https://plann.no/
  badge: stable
  badge_label: Stable
  description: "CLI and TUI for calendars and tasks, live against a CalDAV server. No local sync, no local storage. Successor to calendar-cli."
  categories:
    - user
    - cli
    - featured

- name: calendar-cli
  url: https://github.com/pycalendar/calendar-cli
  badge: sunset
  badge_label: Sunset
  description: "The original CalDAV CLI. Still works, still maintained. New users should start with plann."
  categories:
    - cli

- name: caldav-server-tester
  url: https://github.com/python-caldav/caldav-server-tester
  badge: stable
  badge_label: Stable
  description: "Point it at a CalDAV server and get a full report of what it actually supports, not just what the documentation claims."
  categories:
    - cli
    - client-server

- name: django-icalendar
  url: https://django-icalendar.readthedocs.io/
  badge: poc
  badge_label: Proof of concept
  description: "Django models for iCalendar data, including events, recurrences, attendees, and admin integration out of the box."
  categories:
    - lib

- name: icalendar-anonymizer
  url: https://icalendar-anonymizer.com/
  badge: stable
  badge_label: Stable
  description: "Strip names, emails, and locations from .ics files while keeping all timing and recurrence data intact. Library, CLI, HTTP API, web UI, and Docker image."
  categories:
    - client-server
    - featured
    - user

- name: calendaring-sync
  url: https://calendaring-sync.readthedocs.io/
  badge: poc
  badge_label: Unreleased
  description: "Keeps the state a calendar sync needs between runs: sync tokens, object versions, and the last synced copy. Reports what changed on each side and where changes conflict."
  categories:
    - lib

- name: calendaring-config
  url: https://github.com/pycalendar/calendaring-config
  badge: poc
  badge_label: Pre-alpha
  description: "One configuration file for caldav, calendaring, and calendaring-jmap. Describe your CalDAV servers, JMAP accounts, and .ics directories once, with secrets from a keyring or password manager."
  categories:
    - lib

- name: icalendar-compatibility
  url: https://icalendar-compatibility.readthedocs.io/
  badge: poc
  badge_label: Beta
  description: "Reads event information such as location and description from .ics files the way their creators meant it, smoothing over how differently calendar apps write RFC 5545."
  categories:
    - lib

- name: sphinx-icalendar
  url: https://sphinx-icalendar.readthedocs.io/
  badge: poc
  badge_label: Alpha
  description: "Sphinx extension that renders iCalendar and jCal code blocks in documentation as interactive event tables, next to the source."
  categories:
    - lib

- name: ai.pycal.org
  url: https://ai.pycal.org/
  badge: stable
  badge_label: Live
  description: "Contributors sign a project's AI policy or contributor license agreement once, and a GitHub App labels and checks their pull requests. Any GitHub project can use it."
  categories:
    - services

- name: insight.pycal.org
  url: https://insight.pycal.org/
  badge: stable
  badge_label: Live
  description: "Community insights for GitHub projects: response times to issues and pull requests, contributors, and badges to show them."
  categories:
    - services

- name: ai-prompt-auto-commit
  url: https://github.com/pycalendar/ai-prompt-auto-commit
  badge: poc
  badge_label: Beta
  description: "pre-commit hook that records the prompts you send to Claude Code or Codex and appends them to your commit messages, so the history shows the AI assistance behind each change."
  categories:
    - services
